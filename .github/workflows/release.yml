name: Create Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Build and Upload Script
        env:
          PASTEBIN_API_KEY: ${{ secrets.PASTEBIN_API_KEY }}
        shell: python
        run: |
          import os
          import re
          import urllib.request
          import urllib.parse

          def get_lua_long_string(content):
              equals_count = 4
              while True:
                  closing_seq = "]" + "=" * equals_count + "]"
                  if closing_seq not in content:
                      break
                  equals_count += 1
              eq_str = "=" * equals_count
              return f"[{eq_str}[\n{content}]{eq_str}]"

          def upload_to_dpaste(content):
              try:
                  data = urllib.parse.urlencode({
                      'content': content,
                      'lexer': 'lua',
                      'format': 'url',
                      'expires': '30days'
                  }).encode('utf-8')
                  headers = {
                      'User-Agent': 'Mozilla/5.0',
                      'Content-Type': 'application/x-www-form-urlencoded'
                  }
                  req = urllib.request.Request("https://dpaste.com/api/", data=data, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      dpaste_url = response.read().decode('utf-8').strip()
                      if not dpaste_url.endswith(".txt"):
                          if dpaste_url.endswith("/"):
                              dpaste_url = dpaste_url[:-1]
                          dpaste_url += ".txt"
                      return dpaste_url
              except Exception as e:
                  print(f"Warning: dpaste upload failed: {e}")
                  return None

          def upload_to_pastebin(content, title):
              api_key = os.environ.get("PASTEBIN_API_KEY")
              if not api_key:
                  print("Warning: PASTEBIN_API_KEY not set. Skipping Pastebin upload.")
                  return None
              try:
                  data = urllib.parse.urlencode({
                      'api_dev_key': api_key,
                      'api_option': 'paste',
                      'api_paste_code': content,
                      'api_paste_name': title,
                      'api_paste_format': 'lua',
                      'api_paste_expire_date': '1M',
                      'api_paste_private': '1'
                  }).encode('utf-8')
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                  }
                  req = urllib.request.Request("https://pastebin.com/api/api_post.php", data=data, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      res_url = response.read().decode('utf-8').strip()
                      if res_url.startswith("https://pastebin.com/"):
                          return res_url.split("/")[-1]
                      else:
                          print(f"Warning: Pastebin response error: {res_url}")
                          return None
              except Exception as e:
                  print(f"Warning: Pastebin upload failed: {e}")
                  return None

          base_dir = os.getcwd()
          
          ship_files = {}
          startup_path = os.path.join(base_dir, "startup.lua")
          if os.path.exists(startup_path):
              with open(startup_path, "r", encoding="utf-8") as f:
                  ship_files["startup.lua"] = f.read()
                  
          flightos_dir = os.path.join(base_dir, "flightos")
          for root, dirs, filenames in os.walk(flightos_dir):
              for filename in filenames:
                  if filename.endswith(".lua"):
                      full_path = os.path.join(root, filename)
                      rel_path = os.path.relpath(full_path, base_dir).replace("\\", "/")
                      with open(full_path, "r", encoding="utf-8") as f:
                          ship_files[rel_path] = f.read()

          ship_installer = "local files = {}\n\n"
          for rel_path, content in sorted(ship_files.items()):
              long_str = get_lua_long_string(content)
              ship_installer += f'files["{rel_path}"] = {long_str}\n\n'
              
          ship_installer += """print("FlightOS Installer: cleaning up old files...")
          local has_config = fs.exists("flightos/config.dat")
          if has_config then
              fs.copy("flightos/config.dat", "config.dat.bak")
              print("Backed up config.dat")
          end
          if fs.exists("flightos") then
              fs.delete("flightos")
              print("Deleted old flightos/ folder")
          end
          if fs.exists("startup.lua") then
              fs.delete("startup.lua")
              print("Deleted old startup.lua")
          end

          print("FlightOS Installer: generating directories...")
          fs.makeDir("flightos")
          fs.makeDir("flightos/apps")

          if has_config then
              fs.copy("config.dat.bak", "flightos/config.dat")
              fs.delete("config.dat.bak")
              print("Restored config.dat")
          end

          for path, content in pairs(files) do
              local f = fs.open(path, "w")
              if f then
                  f.write(content)
                  f.close()
                  print("Installed: " .. path)
              else
                  print("Failed to write: " .. path)
              end
          end
          print("\\nFlightOS installation complete!")
          print("Rebooting in 3 seconds to apply all changes...")
          sleep(3)
          os.reboot()
          """

          with open(os.path.join(base_dir, "installer.lua"), "w", encoding="utf-8") as f:
              f.write(ship_installer)

          tablet_files = {}
          for filename in ["startup.lua", "remote.lua"]:
              filepath = os.path.join(base_dir, "tablet", filename)
              if os.path.exists(filepath):
                  with open(filepath, "r", encoding="utf-8") as f:
                      tablet_files[filename] = f.read()

          tablet_installer = "local files = {}\n\n"
          for rel_path, content in sorted(tablet_files.items()):
              long_str = get_lua_long_string(content)
              tablet_installer += f'files["{rel_path}"] = {long_str}\n\n'
              
          tablet_installer += """print("FlightOS Remote Installer")
          print("========================")

          for path, content in pairs(files) do
              local f = fs.open(path, "w")
              if f then
                  f.write(content)
                  f.close()
                  print("Installed: " .. path)
              else
                  print("Failed to write: " .. path)
              end
          end
          print("")
          print("Installation complete!")
          print("Rebooting in 3 seconds...")
          sleep(3)
          os.reboot()
          """

          tablet_dir = os.path.join(base_dir, "tablet")
          os.makedirs(tablet_dir, exist_ok=True)
          with open(os.path.join(tablet_dir, "installer.lua"), "w", encoding="utf-8") as f:
              f.write(tablet_installer)

          ship_dpaste = upload_to_dpaste(ship_installer)
          tablet_dpaste = upload_to_dpaste(tablet_installer)
          ship_pastebin = upload_to_pastebin(ship_installer, "FlightOS Ship OS Installer")
          tablet_pastebin = upload_to_pastebin(tablet_installer, "FlightOS Tablet Remote Installer")

          readme_path = os.path.join(base_dir, "README.md")
          if os.path.exists(readme_path):
              with open(readme_path, "r", encoding="utf-8") as f:
                  readme_content = f.read()

              ship_cmd = None
              if ship_pastebin:
                  ship_cmd = f"pastebin run {ship_pastebin}"
              elif ship_dpaste:
                  ship_cmd = f"wget {ship_dpaste} installer.lua && installer.lua"

              tablet_cmd = None
              if tablet_pastebin:
                  tablet_cmd = f"pastebin run {tablet_pastebin}"
              elif tablet_dpaste:
                  tablet_cmd = f"wget {tablet_dpaste} installer.lua && installer.lua"

              if ship_cmd:
                  readme_content = re.sub(
                      r"<!-- SHIP_INSTALL -->.*?<!-- /SHIP_INSTALL -->",
                      f"<!-- SHIP_INSTALL -->`{ship_cmd}`<!-- /SHIP_INSTALL -->",
                      readme_content,
                      flags=re.DOTALL
                  )
              if tablet_cmd:
                  readme_content = re.sub(
                      r"<!-- TABLET_INSTALL -->.*?<!-- /TABLET_INSTALL -->",
                      f"<!-- TABLET_INSTALL -->`{tablet_cmd}`<!-- /TABLET_INSTALL -->",
                      readme_content,
                      flags=re.DOTALL
                  )

              with open(readme_path, "w", encoding="utf-8") as f:
                  f.write(readme_content)

          release_notes = f"""# FlightOS Release

          ## Installation / Update Commands for Minecraft

          * **Ship Computer OS**:
            * Command: `pastebin run {ship_pastebin or "N/A"}`
            * Fallback: `{ship_dpaste or "N/A"}`
          * **Pocket Remote Tablet**:
            * Command: `pastebin run {tablet_pastebin or "N/A"}`
            * Fallback: `{tablet_dpaste or "N/A"}`

          ---

          ## Artifacts

          Both standalone files `installer.lua` and `tablet/installer.lua` are attached to this release.
          """
          with open(os.path.join(base_dir, "release_notes.md"), "w", encoding="utf-8") as f:
              f.write(release_notes)

      - name: Commit and Push Updated README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update installation links in README [skip ci]" || echo "No changes to README"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            installer.lua
            tablet/installer.lua
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
